name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One shell on all three systems: bash stops at the first failing command, PowerShell does not.
defaults:
  run:
    shell: bash

jobs:
  # Unit tests and lint on every supported system, oldest and newest Python.
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The package itself is installed too, so the tests import it the way users get it.
      - name: Install FLE Studio and the test tools
        run: python -m pip install -e . pytest ruff

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

  # Drives the real app in a real browser against the fake llama-server (tests/fake_llama_server.py).
  # Screenshots and logs are uploaded for every system, also when a step fails.
  e2e:
    name: e2e (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FLE Studio
        run: python -m pip install .

      - name: Install Playwright
        run: python -m pip install playwright

      - name: Install Chromium (with system libraries)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        run: python -m playwright install chromium

      - name: Run the end-to-end test
        run: python tests/e2e/run_e2e.py --out e2e-out

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: e2e-out/
          if-no-files-found: warn
          retention-days: 14
